# Copy to config.toml. Paths are resolved by the Windows Worker.
worker_id = 'worker-01'
project = 'D:\UnityWorkers\worker-01\project'
# git_root defaults to project. Set it to the checkout root when Unity is nested.
# git_root = 'D:\UnityWorkers\worker-01\repo'
# ignored_cache_paths = ['client/Assets/Packages', 'client/Assets/Packages.meta']
# allowed_tracked_outputs = ['Logs/LadderApproachTests.log']
logs = 'D:\UnityWorkers\worker-01\state'
unity_exe = 'C:\UnityVersions\2022.3.62f3\Editor\Unity.exe'
unity_version = '2022.3.62f3'
unity_timeout = 1800

git_exe = 'git'
git_remote = 'origin'
base_branch = 'main'
git_timeout = 600
init_submodules = false

# Use the native executable, e.g. the vendor codex.exe from the npm installation.
# Leave the two entries commented out to deploy startup smoke without Codex.
# codex_exe = 'D:\UnityWorkers\tools\codex\codex.exe'
# codex_home = 'D:\UnityWorkers\worker-01\codex-home'
codex_sandbox = 'mxc'
codex_timeout = 1800
max_fixes = 3
test_modes = ['editmode', 'playmode']
max_diff_bytes = 2000000

# Set UNITY_WORKER_TOKEN and a different UNITY_WORKER_APPROVAL_TOKEN in the service environment.
# Optional PR/MR creation uses UNITY_PR_PROVIDER, UNITY_PR_API_URL, UNITY_PR_REPOSITORY and UNITY_PR_TOKEN.

# Optional per-mode assembly allowlist. When present, development requests require test_selection.
# Service-level keys for pool mode. Place these before TOML tables.
# default_pool = "game"
# legacy_slot = "worker-01"
# max_parallel_unity = 1

# [test_assemblies]
# editmode = ['Game.Tests.EditMode']
# playmode = ['Game.Tests.PlayMode']

# To use named pools, move project, git_root and codex_home into each slot.
# The simple single-project configuration above remains valid on its own.
# [pools.game]
# unity_exe = 'C:\UnityVersions\2022.3.62f3\Editor\Unity.exe'
# unity_version = "2022.3.62f3"
# git_remote = "origin"
# base_branch = "main"
# remote_identity = "<SHA-256 of fetch URL, NUL, then push URL>"
#
# [[pools.game.slots]]
# id = "worker-01"
# git_root = 'D:\UnityWorkers\worker-01'
# project = 'D:\UnityWorkers\worker-01\client'
# codex_home = 'D:\UnityWorkers\homes\worker-01'
#
# [[pools.game.slots]]
# id = "worker-02"
# git_root = 'D:\UnityWorkers\worker-02'
# project = 'D:\UnityWorkers\worker-02\client'
# codex_home = 'D:\UnityWorkers\homes\worker-02'
